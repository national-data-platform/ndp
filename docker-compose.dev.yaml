version: "3"

services:
  # starting ckan section
  ckan:
    platform: linux/amd64
    build:
      context: ckan-docker/ckan
      dockerfile: Dockerfile.dev
      # dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./src_extensions:/srv/app/src_extensions
      - ./logs:/srv/app/logs
      - ./ckan-docker/supervisord/ckan_harvesting.conf:/etc/supervisord.d/ckan_harvesting.conf
      - ./ckan.ini:/srv/app/ckan.ini
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000"]
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"

  datapusher:
    platform: linux/amd64
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: datapusher
    restart: always

  db:
    platform: linux/amd64
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: db
    restart: always

  solr:
    platform: linux/amd64
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: solr
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"

  redis:
    platform: linux/amd64
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: redis
    restart: always

  # starting mlflow section
  minio:
    platform: linux/amd64
    extends:
      file: mlflow/docker-compose.yaml
      service: minio
    restart: always

  create-s3-buckets:
    platform: linux/amd64
    extends:
      file: mlflow/docker-compose.yaml
      service: create-s3-buckets
    restart: always

  mlflow:
    platform: linux/amd64
    build:
      context: mlflow/core
      dockerfile: Dockerfile
    volumes:
      - "mlflow:/mlflow"
    depends_on:
      - minio
      - db
    environment:
      - GUNICORN_CMD_ARGS
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_BUCKET_NAME
      - MLFLOW_S3_ENDPOINT_URL
      - MLFLOW_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - KEYCLOAK_ISSUER
      - MLFLOW_FLASK_SECRET_KEY
      - MLFLOW_HOST
      - MLFLOW_KEYCLOAK_CLIENT_ID
      - MLFLOW_KEYCLOAK_CLIENT_SECRET
      - MLFLOW_DEFAULT_PASSWORD
      - MLFLOW_TRACKING_USERNAME
      - MLFLOW_TRACKING_PASSWORD
      - MLFLOW_ROOT_PATH
    restart: always

  frontend:
#    platform: linux/amd64
    build:
      context: ndp-frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - KEYCLOAK_ID
      - KEYCLOAK_SECRET
      - KEYCLOAK_ISSUER
      - KEYCLOAK_TOKEN_URL
      - NEXTAUTH_URL
      - NEXTAUTH_SECRET
      - NEXT_PUBLIC_NDP_PASSWORD
      - NEXT_PUBLIC_CKAN_URL
      - NEXT_AWESOME_SERVER_URL
      - NEXT_PUBLIC_CKAN_CATALOG_URL
      - NEXT_PUBLIC_JUPYTER_HUB_URL
      - NEXT_PUBLIC_ML_FLOW_URL
      - NEXT_PUBLIC_KEYCLOAK_API_URL
      - NEXT_PUBLIC_MAILING_LIST_EMAIL
      - NEXT_PUBLIC_NODE_MAILER_EMAIL
      - NEXT_PUBLIC_NODE_MAILER_PSWD
      - NEXT_WORKSPACE_APIS_URL
      - NEXT_PUBLIC_PREKAN_CATALOG_URL
      - NEXT_PUBLIC_NDP_VERSION
      - NEXT_PUBLIC_NDP_RELEASE_NOTES
      - NEXT_PUBLIC_NDP_DOCS_LINK
      - NEXT_PUBLIC_KEYCLOAK_LOGOUT_URL
      - NEXT_PUBLIC_POP_FEDERATION_URL
      - NEXT_PUBLIC_POP_FACTORY_URL
      - NEXT_PUBLIC_POP_TOKEN_URL
      - NEXT_PUBLIC_DEMOCRATIZING_DATA_DASHBOARD_URL
      - NEXT_DATA_DEMOCRATIZATION_API


  nginx:
    platform: linux/amd64
    image: nginx:alpine3.18-slim
    # depends_on:
      # - ckan
      # - jupyterhub
      # - mlflow
    ports:
      - "0.0.0.0:8443:80"
      #- "0.0.0.0:8443:443"
    restart: always
    environment:
      - CKAN_PORT
      - JUPYTERHUB_PROXY_PORT
      - MLFLOW_PORT
      - ENV=dev
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  workspaces-api:
    platform: linux/amd64
    build:
      context: ndp-workspaces-api
      dockerfile: Dockerfile
#    ports:
#      - "8005:8000"
    command: ["sh", "-c", "uvicorn src.main:app --reload --workers 8 --host 0.0.0.0 --port 8000"]
    restart: always  # This will restart the container if it fails or becomes unhealthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]  # Health check to the FastAPI app
      interval: 30s  # Time between health checks (30 seconds)
      timeout: 10s    # Time to wait for a health check response
      retries: 3      # Number of retries before marking the container as "unhealthy"
      start_period: 10s  # Time to wait before starting health checks after container starts
    depends_on:
      - workspace-db
    environment:
      - CKAN_SQLALCHEMY_URL
      - WFR_BASE_PATH
      - ROOT_URL
      - BACKEND_PORT
      - WORKSPACE_DB_URL
      - WFR_DOCS_URL
      - SERVER_URL
      - REALM
      - CLIENT_ID
      - JUPYTERHUB_CLIENT_ID
      - CLIENT_SECRET
      - AUTHORIZATION_URL
      - TOKEN_URL
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - ADMIN_REALM
      - FROM_EMAIL
      - EMAIL_SMTP
      - EMAIL_PORT
      - EMAIL_SECRET
      - JUPYTERHUB_CLIENT_SECRET
      - CKAN_DEFAULT
      - API_PROXY_PATH
    volumes:
        - ./ndp-workspaces-api/src:/code/src
        - ./ndp-workspaces-api/alembic:/code/alembic

  # second instance of ckan (we call it Precan)
  ckan2:
    platform: linux/amd64
    build:
      context: ckan-docker/ckan
      dockerfile: Dockerfile2.dev
      # dockerfile: Dockerfile
      args:
        - TZ=${TZ}
    env_file:
      - .env_ckan2
    depends_on:
      db2:
        condition: service_healthy
      solr2:
        condition: service_healthy
      redis2:
        condition: service_healthy
    volumes:
      - ckan_storage2:/var/lib/ckan
      - ./src_extensions:/srv/app/src_extensions
      - ./ckan2.ini:/srv/app/ckan.ini
      - ./logs:/srv/app/logs
      # - ./supervisord/ckan_harvesting.conf:/etc/supervisord.d/ckan_harvesting.conf
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000"]
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"

  datapusher2:
    platform: linux/amd64
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: datapusher2
    restart: always

  db2:
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: db2
    restart: always

  solr2:
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: solr2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"

  redis2:
    platform: linux/amd64
    extends:
      file: ckan-docker/docker-compose.dev.yml
      service: redis2
    restart: always

  workspace-db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER_WORKSPACES}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_WORKSPACES}
      - POSTGRES_DB=${POSTGRES_DB_WORKSPACES}
    volumes:
      - pg_workspace_data:/var/lib/postgresql/data
    restart: unless-stopped
      # ports:
      # - "8888:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]

  mkdocs:
    image: squidfunk/mkdocs-material
#    ports:
#      - "8000:8000"
    volumes:
      - ./ndp-documentation:/docs
    stdin_open: true
    tty: true
    restart: always

volumes:
  ckan_storage:
  ckan_storage2:
  pg_data:
  pg_data2:
  pg_workspace_data:
  solr_data:
  solr_data2:
  miniodata:
  mlflow:
#  jupyterhub:
